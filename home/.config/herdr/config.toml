# -----------------------------------------------------------------------------
# Configures Herdr's keyboard shortcuts and user interface preferences.
# -----------------------------------------------------------------------------

[keys]

# Uses Ctrl+B as the leader key for Herdr shortcuts.
prefix = "ctrl+b"

# Configures shortcuts for pane navigation and window management.
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"

split_horizontal = "prefix+double_quote"
split_vertical   = "prefix+percent"

new_tab   = "prefix+c"
close_tab = "prefix+ampersand"

workspace_picker = "prefix+w"
goto             = "prefix+g"

# Opens Herdr's copy mode. The keys used while inside copy mode
# are built in and can't be configured.
copy_mode = "prefix+y"

[ui]

# Groups agents by space in the Agents panel.
agent_panel_sort = "spaces"